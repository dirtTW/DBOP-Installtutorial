name: Deploy Astro site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Allow rebuild by clicking a button
  repository_dispatch:
    types: [rebuild]


# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "." # default value when not using subfolders
  # BUILD_PATH: subfolder
  # Emscripten SDK version the converter is built with. Pinned to what je2be-web
  # itself pins in its Dockerfile: newer Emscripten ships a libc++ that rejects the
  # transitive includes leveldb and other bundled dependencies rely on.
  EMSDK_VERSION: 3.1.26
  # The core and the web harness the converter is assembled from. The core is the
  # fork that carries the 26.x support; push that branch before relying on this.
  CONVERTER_CORE_REPOSITORY: dirtTW/je2be-core
  CONVERTER_CORE_REF: main
  CONVERTER_HARNESS_REPOSITORY: kbinani/je2be-web

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
        working-directory: ${{ env.BUILD_PATH }}

      # --- The world converter's WebAssembly core -------------------------------
      # je2be-web builds the core; the fork that understands Minecraft 26.x is
      # dropped in as its submodule. Same commands as build-wasm.cmd, which is what
      # this is developed against.
      - name: Restore Emscripten SDK
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}

      - name: Install Emscripten
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "${{ env.EMSDK_VERSION }}"
          "$RUNNER_TEMP/emsdk/emsdk" activate "${{ env.EMSDK_VERSION }}"

      - name: Checkout converter core
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.CONVERTER_CORE_REPOSITORY }}
          ref: ${{ env.CONVERTER_CORE_REF }}
          path: wasm/je2be-core

      - name: Checkout converter harness
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.CONVERTER_HARNESS_REPOSITORY }}
          path: wasm/je2be-web

      - name: Build the converter
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"

          # Same LTO sysroot prebuild as je2be-web's Dockerfile. Emscripten would
          # otherwise compile these while linking, which works but is slower.
          SYSROOT_LTO="$RUNNER_TEMP/emsdk/upstream/emscripten/cache/sysroot/lib/wasm32-emscripten/lto"
          if [ ! -d "$SYSROOT_LTO" ]; then
            pushd "$RUNNER_TEMP/emsdk/upstream/emscripten"
            python embuilder.py build --lto libGL-mt libal libhtml5 libstubs-debug \
              libnoexit libc-mt-debug libdlmalloc-mt libcompiler_rt-mt libc++-mt \
              libc++abi-debug-mt libsockets-mt crtbegin
            popd
          fi

          rm -rf wasm/je2be-web/deps/je2be-core
          cp -a wasm/je2be-core wasm/je2be-web/deps/je2be-core
          rm -rf wasm/je2be-web/deps/je2be-core/.git
          mkdir -p wasm/je2be-web/build/cxx
          cd wasm/je2be-web/build/cxx
          emcmake cmake ../.. -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_LIBRARY_PATH="$SYSROOT_LTO"
          cmake --build . --parallel "$(nproc)" --target core --config Release
          cd "$GITHUB_WORKSPACE"
          mkdir -p public/converter
          ls -l wasm/je2be-web/build/cxx/core.js wasm/je2be-web/build/cxx/core.worker.js
          cp wasm/je2be-web/build/cxx/core.js wasm/je2be-web/build/cxx/core.worker.js public/converter/

      # -------------------------------------------------------------------------

      - name: Build with Astro
        run: |
          ${{ steps.detect-package-manager.outputs.runner }} astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
        working-directory: ${{ env.BUILD_PATH }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
